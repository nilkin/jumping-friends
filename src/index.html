    const o = actx.createOscillator(), g = actx.createGain ? actx.createGain() : actx.createGainNode();

function smooth(u) { return u * u * (3 - 2 * u); }
function moundH(m, x) {
  const d = Math.abs(x - m.x), half = m.plat / 2;

  return m.h * smooth(1 - (d - half) / m.slope);

}

  const left = m.x - m.plat / 2 - m.slope, right = m.x + m.plat / 2 + m.slope;
  ctx.beginPath(); ctx.moveTo(left, GROUND + 1);
  for (let x = left; x <= right; x += 4) ctx.lineTo(x, GROUND - moundH(m, x));
  ctx.lineTo(right, GROUND + 1); ctx.closePath();
  const g = ctx.createLinearGradient(0, GROUND - m.h, 0, GROUND);

  ctx.strokeStyle = num('snow') > 0.5 ? '#ffffff' : col('grass'); ctx.lineWidth = num('snow') > 0.5 ? 8 : 5; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = left + 6; x <= right - 6; x += 4) {
    const y = GROUND - moundH(m, x);
    x === left + 6 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  // xallar
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  for (const d of m.dots) {
    const x = m.x + d[0] * (m.plat / 2 + m.slope * 0.6);
    const top = GROUND - moundH(m, x);
    if (GROUND - top > 10) { ctx.beginPath(); ctx.arc(x, top + (GROUND - top) * d[1], 3, 0, Math.PI * 2); ctx.fill(); }
  }
}

}
function makeFan() {

    return [{ type: 'desk', r: 20, pole: 14, color, off: 0, mh }, { type: 'desk', r: 20, pole: 14, color: c2, off: 46, mh }];
  }
  if (k < 0.75) return [{ type: 'ac', w: 78, h: 48, color, mh: 22 + Math.random() * 10 }];
  return [{ type: 'washer', w: 58, h: 64, color, mh: 14 + Math.random() * 10 }];
}

function drawAC(f) {

  ctx.beginPath(); ctx.arc(gx, gy, gr + 3, 0, Math.PI * 2); ctx.stroke();

  // jalüzlər
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(x + 50, y + 15 + i * 6); ctx.lineTo(x + w - 8, y + 15 + i * 6); ctx.stroke(); }
  // işıq
  ctx.fillStyle = Math.sin(t * 4) > 0 ? '#7dff8a' : '#2fd4a8';

function spawn() {
  const group = makeFan();
  const startX = W + 170, span = group[group.length - 1].off || 0;
  mounds.push({ x: startX + span / 2, plat: span + (isBox(group[0]) ? group[0].w + 24 : 70), slope: 75, h: group[0].mh,
    c: HILL_COLORS[Math.floor(Math.random() * HILL_COLORS.length)],
    dots: Array.from({ length: 5 }, () => [Math.random() * 2 - 1, 0.3 + Math.random() * 0.5]) });
  for (const f of group) {
    f.x = startX + (f.off || 0);
    f.base = GROUND - f.mh;
    f.angle = Math.random() * Math.PI;
    f.spin = 10 + Math.random() * 8;
    fans.push(f);
  }
  stars.push({ x: startX + span / 2, y: Math.min(...group.map(topY)) - 50, got: false, a: 0 });
  const minGap = Math.max(520, speed * 1.6);
  nextFan = minGap + Math.random() * speed * 1.2;
}
function fanCenterY(f) { return f.base - f.pole - f.r - 6; }

function drawFan(f) {
  const cx = f.x, cy = fanCenterY(f);
  // kölgə
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(cx, f.base + 4, f.r + 6, 5, 0, 0, Math.PI * 2); ctx.fill();
  // oturacaq
  ctx.fillStyle = f.color;
  ctx.beginPath(); ctx.ellipse(cx, f.base, f.r * 0.9, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(cx - 4, f.base - 2, f.r * 0.45, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  // dirək
  ctx.fillStyle = '#e8e8f0';
  ctx.fillRect(cx - 3.5, cy + f.r - 2, 7, f.base - (cy + f.r) + 2);
  // qəfəs arxa
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(cx, cy, f.r + 4, 0, Math.PI * 2); ctx.fill();
  // pərlər
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(f.angle);
  for (let i = 0; i < 3; i++) {
    ctx.rotate(Math.PI * 2 / 3);
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.ellipse(0, -f.r * 0.5, f.r * 0.28, f.r * 0.5, 0.35, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // qəfəs xətləri
  ctx.strokeStyle = 'rgba(80,80,110,.55)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * (f.r + 4), cy + Math.sin(a) * (f.r + 4)); ctx.stroke();
  }
  ctx.strokeStyle = '#555577'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, f.r + 4, 0, Math.PI * 2); ctx.stroke();
  // mərkəz
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = f.color;
  ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fill();
  // külək xətləri
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const ph = (t * 3 + i * 0.33) % 1;

    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - 14, ly); ctx.stroke();

}

  const sw = Math.min(124, (W - 60) / 3), lw = 62;
  const speedIcons = ['🐢 ', '🐇 ', '🚀 '];
  return [
    ...[0, 1, 2].map(i => ({ x: W / 2 - (sw * 3 + 20) / 2 + i * (sw + 10), y: 238, w: sw, h: 34, label: speedIcons[i] + T('speed')[i], sel: speedIdx === i, act: () => { speedIdx = i; applyLang(); } })),
    ...langRow(lw),
  ];
}
// Dil düymələri + şəkil (avatar) düyməsi, şəkil varsa silmək üçün ✕
function langRow(lw) {
  const items = LANGS.map(l => ({ w: lw, label: l.toUpperCase(), sel: lang === l, act: () => { lang = l; applyLang(); } }));
  items.push({ w: lw, label: avatarImg ? '' : '📷', avatar: true, gap: 16, photo: true, act: () => {} });
  if (avatarImg) items.push({ w: 32, label: '✕', act: () => setAvatar(null) });
  let total = 0;
  items.forEach((b, i) => { total += b.w + (i ? (b.gap || 10) : 0); });
  let x = W / 2 - total / 2;
  items.forEach((b, i) => { if (i) x += b.gap || 10; b.x = x; b.y = 284; b.h = 32; b.sel = !!b.sel; x += b.w; });
  return items;
}
function endButton() { return { x: W / 2 - 120, y: 262, w: 240, h: 42 }; }
function goMenu() { state = 'menu'; reset(); }
function txtFit(s, x, y, size, color, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", sans-serif`;
  while (ctx.measureText(s).width > maxW && size > 12) { size--; ctx.font = `bold ${size}px "Trebuchet MS", sans-serif`; }
  txt(s, x, y, size, color);
}

// ---------- Toqquşma ----------
function hit(f) {
  // çəyirtkə qutusu
  const hx1 = hop.x - 30, hx2 = hop.x + 34, hy1 = hop.y - 50, hy2 = hop.y - 6;
  // qəfəs dairəsi
  if (isBox(f)) {
    const bx1 = f.x - f.w / 2 + 5, bx2 = f.x + f.w / 2 - 5, by1 = f.base - f.h + 2;
    return hx2 > bx1 && hx1 < bx2 && hy2 > by1;
  }
  const cx = f.x, cy = fanCenterY(f), r = f.r - 3;
  const nx = Math.max(hx1, Math.min(cx, hx2)), ny = Math.max(hy1, Math.min(cy, hy2));
  if ((nx - cx) ** 2 + (ny - cy) ** 2 < r * r) return true;
  // dirək
  if (hx2 > cx - 4 && hx1 < cx + 4 && hy2 > cy + r) return true;
  return false;
}

// ---------- Pauza ----------
const pauseBtn = document.getElementById('pause');
if (fsBtn.style.display === 'none') pauseBtn.style.right = '10px';
function setPaused(p) {
  if (state !== 'play') p = false;
  if (paused === p) return;
  paused = p; hop.holding = false;
  beep(p ? 440 : 660, 0.08, 'triangle', 0.05);
}
onPress(pauseBtn, e => { e.preventDefault(); e.stopPropagation(); setPaused(!paused); });
pauseBtn.addEventListener('click', e => { e.stopPropagation(); pauseBtn.blur(); });
// P, Esc, klaviaturanın Pause düyməsi, TV pultunun Pause/Play düymələri
const PAUSE_KEYS = ['p', 'P', 'Escape', 'Esc', 'Pause', 'MediaPause', 'MediaPlayPause'];
const PAUSE_CODES = [80, 27, 19, 179];
function isPauseKey(e, k) { return PAUSE_KEYS.includes(k) || PAUSE_CODES.includes(e.keyCode); }
function isPlayKey(e, k) { return k === 'MediaPlay' || e.keyCode === 415; }
function onVisibility() { if (document.hidden || document.webkitHidden) setPaused(true); }
document.addEventListener('visibilitychange', onVisibility);
document.addEventListener('webkitvisibilitychange', onVisibility);

// ---------- İdarəetmə ----------
function jumpPress() {
  if (state === 'menu') { state = 'play'; reset(); }
  hop.holding = true;
  if (hop.onGround) {
    hop.vy = -num('jump'); hop.onGround = false; hop.squash = -0.6;
    beep(420, 0.15, 'square', 0.05, 380);
    for (let i = 0; i < 6; i++) particles.push({ x: hop.x - 20, y: hop.y, vx: -60 - Math.random() * 120, vy: -Math.random() * 120, life: .4, c: '#a8f5a0' });
  }
}
function jumpRelease() {
  hop.holding = false;
}
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'Enter', 'NumpadEnter', 'Select'];
function isJumpKey(e) { const k = keyOf(e); return JUMP_KEYS.includes(e.code) || k === 'Enter' || k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || e.keyCode === 13 || e.keyCode === 23; }
addEventListener('keydown', e => {
  const key = keyOf(e);
  if (state === 'play' && (isPauseKey(e, key) || isPlayKey(e, key))) {
    e.preventDefault(); if (!e.repeat) setPaused(isPlayKey(e, key) ? false : !paused); return;
  }
  if (paused) {
    if (isJumpKey(e)) { e.preventDefault(); if (!e.repeat) setPaused(false); }
    return;
  }
  if (state === 'menu' && ['ArrowLeft', 'ArrowRight', 'ArrowDown'].includes(key)) {
    e.preventDefault();
    if (key === 'ArrowLeft') speedIdx = Math.max(0, speedIdx - 1);
    if (key === 'ArrowRight') speedIdx = Math.min(2, speedIdx + 1);
    if (key === 'ArrowDown') lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    applyLang(); beep(660, 0.06, 'triangle', 0.05); return;
  }
  if (isJumpKey(e)) {
    e.preventDefault(); if (e.repeat) return;
    if (state === 'end') { if (endT > 1.5) goMenu(); return; }
    jumpPress();
  }
});
addEventListener('keyup', e => { if (!paused && isJumpKey(e)) jumpRelease(); });
onPress(cv, e => {
  e.preventDefault();
  if (paused) { setPaused(false); return; }
  const r = cv.getBoundingClientRect();
  const lx = (e.clientX - r.left) * W / r.width, ly = (e.clientY - r.top) * H / r.height;
  const inside = b => lx >= b.x && lx <= b.x + b.w && ly >= b.y && ly <= b.y + b.h;
  if (state === 'menu') {
    for (const b of menuButtons()) if (inside(b)) { b.act(); beep(660, 0.06, 'triangle', 0.05); return; }
  }
  if (state === 'end') { if (endT > 1 && inside(endButton())) goMenu(); return; }
  jumpPress();
});
onRelease(window, jumpRelease);
// Fayl seçimi pointerdown-dan açılmır (mobil brauzerlər icazə vermir), ona görə click-də açılır
cv.addEventListener('click', e => {
  if (state !== 'menu' || paused) return;
  const r = cv.getBoundingClientRect();
  const lx = (e.clientX - r.left) * W / r.width, ly = (e.clientY - r.top) * H / r.height;
  const b = menuButtons().filter(b => b.photo)[0];
  if (b && lx >= b.x && lx <= b.x + b.w && ly >= b.y && ly <= b.y + b.h) photoInput.click();
});

// ---------- Mətn ----------
function txt(s, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", sans-serif`;
  ctx.textAlign = align;
  ctx.lineWidth = size / 5; ctx.strokeStyle = 'rgba(40,30,80,.75)';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

// ---------- Əsas dövr ----------
let last = performance.now();
function spawnFirework(rate, dt) {
  if (Math.random() < dt * rate) {
    fireworks.push({ x: 60 + Math.random() * (W - 120), y: H, vy: -480 - Math.random() * 160, c: COLORS[Math.floor(Math.random() * COLORS.length)], rocket: true });
    beep(180 + Math.random() * 80, 0.25, 'sine', 0.03, 300);
  }
}
function loop(now) {
  let dt = paused ? 0 : Math.min(0.033, (now - last) / 1000); last = now;
  const showPause = state === 'play' ? 'block' : 'none';
  if (pauseBtn.style.display !== showPause) pauseBtn.style.display = showPause;
  t += dt;
  const realSpeed = speed;
  if (state === 'menu') speed = realSpeed * 0.35;
  else if (state === 'end' || phase === 'win' || phase === 'finale') speed = 0;

  ctx.save();
  if (shakeT > 0) { shakeT -= dt; ctx.translate((Math.random() - .5) * 10 * Math.min(1, shakeT * 3), (Math.random() - .5) * 8 * Math.min(1, shakeT * 3)); }

  if (seasonT < 1) seasonT = Math.min(1, seasonT + dt / 2.5);
  if (seasonMsg > 0) seasonMsg -= dt;
  if (rocketT > 0) rocketT -= dt;
  const nightTarget = state === 'play' && SEASONS[season].earth && stageStars >= 5 ? 1 : 0;
  nightT += Math.sign(nightTarget - nightT) * Math.min(Math.abs(nightTarget - nightT), dt / 2.5);
  updateWeather(dt);
  drawBg(dt);

  if (state === 'play') {
    if (phase === 'run') speed = Math.min(370, 230 + dist * 0.004) * mult();
    else if (phase === 'boss' || (phase === 'bossIntro' && boss)) speed = 200 * mult();
    else if (phase === 'win' || phase === 'finale') speed = 0;
    dist += speed * dt;

    const prevY = hop.y; hop.prevY = prevY;
    hop.vy += num('grav') * dt; hop.y += hop.vy * dt;
    let gy = groundAt(hop.x), onTopOf = null;
    // maneənin üstünə yuxarıdan düşəndə onun üstündə dayanır
    if (hop.vy >= 0) for (const f of fans) {
      const top = obstacleTop(f), half = obstacleHalf(f);
      if (hop.x + 24 > f.x - half && hop.x - 20 < f.x + half && prevY <= top + 14 && hop.y >= top - 2 && top < gy) { gy = top; onTopOf = f; }
    }
    if (hop.y >= gy || (hop.onGround && hop.vy >= 0 && gy - hop.y < 22)) {
      if (!hop.onGround) {
        hop.squash = 0.6;
        if (onTopOf) { beep(520, 0.12, 'sine', 0.06, 260); for (let i = 0; i < 6; i++) particles.push({ x: hop.x, y: gy, vx: (Math.random() - .5) * 200, vy: -Math.random() * 150, life: .35, c: '#ffffff' }); }
      }
      hop.y = gy; hop.vy = 0; hop.onGround = true;
    } else hop.onGround = false;
    if (speed > 0 || !hop.onGround) hop.legT += dt;

    if (phase === 'run') { nextFan -= speed * dt; if (nextFan <= 0) spawn(); }
    for (const f of fans) { f.x -= speed * dt; f.angle += f.spin * dt; }
    for (const m of mounds) m.x -= speed * dt;
    for (const st of stars) {
      st.x -= speed * dt; st.a += dt;
      if (!st.got && Math.abs(st.x - hop.x) < 42 && Math.abs(st.y - (hop.y - 30)) < 48) {
        st.got = true; starCount++;
        beep(988, 0.08, 'triangle', 0.07); setTimeout(() => beep(1319, 0.14, 'triangle', 0.07), 80);
        for (let i = 0; i < 10; i++) particles.push({ x: st.x, y: st.y, vx: (Math.random() - .5) * 300, vy: -Math.random() * 250, life: .6, c: '#ffd93d' });
        if (phase === 'run') {
          stageStars++;
          if (stageStars >= 10) startBossIntro();
          else if (stageStars === 5 && SEASONS[season].earth) {
            seasonMsg = 2.8; bannerA = T('night')[0]; bannerB = T('night')[1];
            [784, 659, 523, 659, 784].forEach((n, i) => setTimeout(() => beep(n, 0.25, 'sine', 0.07), i * 160));
          } else if (stageStars === 5) {
            cheer = 1.6;
            [523, 659, 784, 1047].forEach((n, i) => setTimeout(() => beep(n, 0.18, 'triangle', 0.07), i * 120));
            for (let i = 0; i < 40; i++) particles.push({ x: Math.random() * W, y: -10, vx: (Math.random() - .5) * 120, vy: Math.random() * 100, life: 1.6, c: COLORS[i % COLORS.length] });
          }
        }
      }
    }
    stars = stars.filter(st => st.x > -40 && !st.got);
    if (hop.dizzy > 0) hop.dizzy -= dt;
    if (cheer > 0) cheer -= dt;
    fans = fans.filter(f => f.x > -60);
    mounds = mounds.filter(m => m.x + m.plat / 2 + m.slope > -10);

    if (hop.dizzy <= 0 && (phase === 'run' || phase === 'bossIntro' || phase === 'boss')) for (const f of fans) if (hit(f)) { getHit(); break; }

    if (phase === 'bossIntro' && !boss && fans.length === 0 && mounds.length === 0) {
      const hp = bossDef.kind === 'dragon' ? 9 : 4;
      boss = { def: bossDef, x: W + 140, target: W - Math.min(bossDef.kind === 'dragon' ? 190 : 170, W * 0.22), hp, maxHp: hp, hurt: 0, throwAnim: 0, happy: false, next: 1 };
      if (bossDef.kind === 'dragon') { shakeT = 1; [82, 73, 65].forEach((n, i) => setTimeout(() => beep(n, 0.5, 'sawtooth', 0.08), i * 250)); }
    }
    if (boss) updateBoss(dt);
    if (phase === 'win') updateWin(dt);
    if (phase === 'finale') {
      finT += dt; hop.dizzy = 0;
      spawnFirework(7, dt);
      if (hop.onGround && Math.random() < dt * 1.4) { hop.vy = -650; hop.onGround = false; }
      updateFriends(dt);
      if (finT > 6) { state = 'end'; endT = 0; }
    }
  } else if (state === 'end') {
    endT += dt; hop.dizzy = 0;
    spawnFirework(2.5, dt);
    hop.vy += 1900 * dt; hop.y += hop.vy * dt;
    if (hop.y >= GROUND) { hop.y = GROUND; hop.vy = 0; hop.onGround = true; if (Math.random() < 0.02) { hop.vy = -600; hop.onGround = false; } } else hop.onGround = false;
    updateFriends(dt);
  } else {
    for (const f of fans) f.angle += f.spin * dt;
    if (state === 'menu') { hop.legT += dt; hop.y = GROUND - Math.abs(Math.sin(t * 3)) * 18; }
  }
  if (state === 'menu') speed = realSpeed;
  hop.squash *= 0.85;
  updateFireworks(dt);

  drawFireworks();
  for (const m of mounds) drawMound(m);
  for (const f of fans) drawObstacle(f);
  for (const st of stars) drawStar(st.x, st.y + Math.sin(st.a * 4) * 5, 18, '#ffd93d', Math.sin(st.a * 3) * 0.25);
  if (boss) drawBoss(boss);
  for (const p of projectiles) drawProj(p);
  if (gift) drawGift(gift);
  if (friends.length) drawFriends();
  drawHopper();

  drawWeather();
  particles = particles.filter(p => (p.life -= dt) > 0);
  for (const p of particles) {
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  floatTexts = floatTexts.filter(f => (f.life -= dt) > 0);
  for (const f of floatTexts) { f.y -= 40 * dt; ctx.globalAlpha = Math.min(1, f.life * 2); txt(f.s, f.x, f.y, 28, f.c); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // panel
  if (state === 'play') {
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    rr(14, 12, 230, 52, 26); ctx.fill();
    drawStar(42, 38, 18, '#ffd93d', Math.sin(t * 2) * 0.15);
    txt(String(starCount), 90, 50, 30, '#ffd93d');
    for (let i = 0; i < 3; i++) {
      const f = i < lives - 1 ? 1 : i === lives - 1 ? (hitHalf ? 0.5 : 1) : 0;
      heartFill(150 + i * 32, 38, 1.4, f);
    }
    if (gifts.length) {
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      rr(14, 70, Math.min(gifts.length, 9) * 30 + 16, 36, 18); ctx.fill();
      ctx.font = '22px sans-serif'; ctx.textAlign = 'center';
      gifts.slice(-9).forEach((g, i) => ctx.fillText(g, 37 + i * 30, 96));
    }
    if (phase !== 'finale') {
      const narrow = W < 720;
      const px0 = narrow ? W / 2 - 5 * 22 : Math.max(272, W / 2 - 5 * 22 + 11), py = narrow ? 320 : 28;
      for (let i = 0; i < 10; i++) {
        if (i < Math.min(stageStars, 10)) drawStar(px0 + i * 22, py, 9, '#ffd93d');
        else { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(px0 + i * 22, py, 5, 0, Math.PI * 2); ctx.fill(); }
      }
      crown(px0 + 10 * 22 + 6, py + 8, 0.7);
    }
    if (seasonMsg > 0) {
      const sc = Math.min(1, (3 - Math.min(3, seasonMsg)) * 4 + (seasonMsg > 3 ? 1 : 0)) * Math.min(1, W / 520);
      ctx.save(); ctx.translate(W / 2, 140); ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      rr(-235, -50, 470, 100, 30); ctx.fill();
      txtFit(bannerA, 0, 0, 40, '#ff8a3d', 440);
      txtFit(bannerB, 0, 36, 24, '#2fd4a8', 440); ctx.restore();
    }
    if (cheer > 0) {
      const sc = 1 + Math.sin((1.6 - cheer) * 10) * 0.08;
      ctx.save(); ctx.translate(W / 2, 140); ctx.scale(sc, sc);
      txt(T('great'), 0, 0, 56, '#ff5e7e'); ctx.restore();
    }
  }

  if (state === 'menu') {
    txtFit(T('title'), W / 2, 62, 44, '#ffd93d', W - 40);
    const pr = 40 + Math.sin(t * 4) * 4;
    ctx.fillStyle = '#2fd4a8'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(W / 2, 140, pr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(W / 2 - 12, 120); ctx.lineTo(W / 2 + 22, 140); ctx.lineTo(W / 2 - 12, 160); ctx.closePath(); ctx.fill();
    txt(T('play'), W / 2, 210, 26, '#fff');
    for (const b of menuButtons()) {
      pill(b.x, b.y, b.w, b.h, b.label, b.sel);
      if (b.avatar && avatarImg) {
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2, r = b.h / 2 - 3;
        ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(avatarImg, cx - r, cy - r, r * 2, r * 2); ctx.restore();
      }
    }
    ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillText(T('hint'), W / 2, 334);
  }

  if (state === 'end') {
    const k = Math.min(1, endT * 2);
    ctx.fillStyle = `rgba(20,15,50,${0.45 * k})`; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = k;
    const pw = Math.min(440, W - 30);
    ctx.fillStyle = 'rgba(255,255,255,.93)'; rr(W / 2 - pw / 2, 22, pw, 296, 28); ctx.fill();
    drawTrophy(W / 2, 92 + Math.sin(t * 3) * 3, 1.3);
    txtFit(T('champion'), W / 2, 146, 34, '#ff8a3d', pw - 30);
    drawStar(W / 2 - 40, 178, 16, '#ffd93d');
    txt(String(starCount), W / 2 + 14, 190, 30, '#ffd93d');
    ctx.font = '26px sans-serif'; ctx.textAlign = 'center';
    const gw = Math.min(34, (pw - 30) / Math.max(1, gifts.length));
    gifts.forEach((g, i) => ctx.fillText(g, W / 2 - (gifts.length - 1) * gw / 2 + i * gw, 238));
    const b = endButton();
    ctx.fillStyle = '#2fd4a8'; rr(b.x, b.y, b.w, b.h, 21); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    txtFit(T('replay'), W / 2, b.y + 29, 22, '#fff', b.w - 20);
    ctx.restore();
  }

  drawRocket();

  if (paused) {
    ctx.fillStyle = 'rgba(20,15,50,.55)'; ctx.fillRect(0, 0, W, H);
    const pr = 40 + Math.sin(performance.now() / 250) * 3;
    ctx.fillStyle = '#2fd4a8'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(W / 2, 130, pr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(W / 2 - 12, 110); ctx.lineTo(W / 2 + 22, 130); ctx.lineTo(W / 2 - 12, 150); ctx.closePath(); ctx.fill();
    txtFit(T('paused'), W / 2, 220, 44, '#ffd93d', W - 40);
    txtFit(T('resume'), W / 2, 262, 22, '#fff', W - 40);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
